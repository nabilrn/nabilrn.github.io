name: Portfolio Redesign CI

on:
  push:
    branches:
      - redesign/chanhdai-bento-home
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: portfolio-redesign-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name == 'push' || github.head_ref == 'redesign/chanhdai-bento-home'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Refresh lockfile for dependency cleanup
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Remove retired Starlight runtime naming
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/components/Page.astro')
          text = page.read_text()
          text = text.replace("localStorage.getItem('starlight-theme')", "localStorage.getItem('portfolio-theme')")
          text = '\n'.join(line for line in text.splitlines() if '--sl-color-' not in line) + '\n'
          page.write_text(text)

          toggle = Path('src/components/ThemeToggle.astro')
          text = toggle.read_text().replace("localStorage.setItem('starlight-theme', theme)", "localStorage.setItem('portfolio-theme', theme)")
          toggle.write_text(text)
          PY

          echo "Remaining Starlight references:"
          git grep -ni starlight -- . ':(exclude)pnpm-lock.yaml' ':(exclude).github/workflows/portfolio-redesign-ci.yml' || true

      - name: Commit generated cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated cleanup already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml src/components/Page.astro src/components/ThemeToggle.astro
          git commit -m "chore(cleanup): remove retired Starlight remnants"
          git push origin HEAD:redesign/chanhdai-bento-home

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro check
        run: pnpm exec astro check

      - name: Production build
        run: pnpm build

      - name: Start Astro preview
        shell: bash
        run: |
          pnpm preview --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          echo $! > /tmp/astro-preview.pid

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/astro-preview.log
          exit 1

      - name: Install Chrome for accessibility audit
        run: pnpm dlx puppeteer@24.43.1 browsers install chrome

      - name: Accessibility audit
        run: >-
          pnpm dlx pa11y-ci@4.1.1
          --config .pa11yci.json
          --sitemap http://127.0.0.1:4321/sitemap.xml
          --sitemap-find https://portfolio.nabilrn.space
          --sitemap-replace http://127.0.0.1:4321

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/astro-preview.log || true
