name: Portfolio Redesign CI

on:
  push:
    branches:
      - redesign/chanhdai-bento-home
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portfolio-redesign-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name == 'push' || github.head_ref == 'redesign/chanhdai-bento-home'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro check
        run: pnpm exec astro check

      - name: Production build
        run: pnpm build

      - name: Start Astro preview
        shell: bash
        run: |
          pnpm preview --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          echo $! > /tmp/astro-preview.pid

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/astro-preview.log
          exit 1

      - name: Install Chrome for accessibility audit
        run: pnpm dlx puppeteer@24.43.1 browsers install chrome

      - name: Accessibility audit
        run: >-
          pnpm dlx pa11y-ci@4.1.1
          --config .pa11yci.json
          --sitemap http://127.0.0.1:4321/sitemap.xml
          --sitemap-find https://portfolio.nabilrn.space
          --sitemap-replace http://127.0.0.1:4321

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/astro-preview.log || true
