name: Deploy Metrics Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-metrics-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Cloudflare Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm dlx wrangler@4 deploy --config worker/wrangler.toml

      - name: Verify rolling 24 hour summary contract
        if: env.CLOUDFLARE_API_TOKEN != ''
        shell: bash
        run: |
          for attempt in {1..12}; do
            payload="$(curl --fail --silent --show-error https://portfolio-metrics-api.nabilrizkinavisa.workers.dev/analytics/summary || true)"
            valid="$(printf '%s' "$payload" | jq -r '
              (.last24Hours | type == "array") and
              (.last24Hours | length == 24) and
              (.generatedAt | type == "string") and
              (.visitors | type == "number") and
              (.pageviews | type == "number") and
              (.topPage.path | type == "string") and
              (has("last30Days") | not)
            ' 2>/dev/null || echo false)"
            if [ "$valid" = "true" ]; then
              echo "Worker is serving the strict rolling-24h contract."
              exit 0
            fi
            sleep 5
          done

          echo "Worker deployment completed but the public summary did not expose the strict rolling-24h contract in time."
          exit 1

      - name: Explain skipped deployment
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo 'CLOUDFLARE_API_TOKEN is not configured in repository secrets.'
          echo 'The frontend will reject the legacy analytics contract until the Worker is deployed.'
